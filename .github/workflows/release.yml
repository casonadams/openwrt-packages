name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "Release Please"
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: "Build Packages"
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build APK Packages
        run: |
          version="${TAG##*v}"
          export VERSION="${version}-r1"
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Upload Release Packages
        run: |
          gh release upload "$TAG" dist/*.apk --clobber

  checksums:
    name: "Generate SHA256SUMS"
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download release assets
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "*.apk" --clobber

      - name: Generate and upload SHA256SUMS
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum -- *.apk > SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" SHA256SUMS --clobber
