name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ShellCheck Lint
        run: |
          shellcheck -s sh \
            luci-app-screentime/root/usr/bin/screentime \
            luci-app-screentime/root/etc/init.d/screentime \
            luci-app-screentime/root/etc/uci-defaults/99_screentime \
            install.sh \
            scripts/build-apk.sh \
            scripts/generate-pages.sh \
            tests/test_engine.sh

      - name: JavaScript & JSON Syntax Check
        run: |
          node --check luci-app-screentime/htdocs/luci-static/resources/view/screentime/overview.js
          node -e '
          const fs = require("fs");
          const files = [
            "luci-app-screentime/root/usr/share/luci/menu.d/luci-app-screentime.json",
            "luci-app-screentime/root/usr/share/rpcd/acl.d/luci-app-screentime.json",
            "release-please-config.json",
            ".release-please-manifest.json"
          ];
          for (const file of files) {
            JSON.parse(fs.readFileSync(file, "utf8"));
          }
          console.log("All JSON files valid.");
          '

      - name: Run Engine Test Suite
        run: |
          chmod +x tests/test_engine.sh
          ./tests/test_engine.sh

  build:
    name: Build APK Packages
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APKv3 Packages
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages-apk
          path: dist/*.apk
