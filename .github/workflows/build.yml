name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ShellCheck Lint
        run: |
          git ls-files -z | xargs -0 grep -lE '^#!/bin/sh' | xargs shellcheck -x -s sh

      - name: JavaScript & JSON Syntax Check
        run: |
          git ls-files 'luci-app-*/htdocs/*.js' | xargs -n1 node --check
          git ls-files '*.json' | xargs -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'

      - name: Run package tests
        run: |
          for suite in luci-app-*/tests/run.sh; do
            sh "$suite" || exit 1
          done

  build:
    name: Build APK Packages
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APKv3 Packages
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages-apk
          path: dist/*.apk
